name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Name"
        required: true
        default: "mychatbot"

      image_tag:
        description: "Docker Image Tag"
        required: true
        default: "latest"

      environment:
        description: "Environment (dev/qa/prod)"
        required: true
        default: "dev"

# 🌍 Map inputs → env vars
env:
  APP_NAME: ${{ inputs.app_name }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "🟦 Validation stage"
          echo "App: $APP_NAME"
          echo "Tag: $IMAGE_TAG"
          echo "Env: $ENVIRONMENT"

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - run: |
          echo "🟧 Build stage"
          echo "Building $APP_NAME:$IMAGE_TAG for $ENVIRONMENT"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: |
          echo "🟩 Test stage"
          echo "Testing $APP_NAME"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
          echo "🟥 Deploy stage"
          echo "Deploying $APP_NAME:$IMAGE_TAG to $ENVIRONMENT"
